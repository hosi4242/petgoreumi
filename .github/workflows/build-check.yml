name: Build check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - add-pet-product-recommendations

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run TypeScript and Vite build
        run: npm run build
